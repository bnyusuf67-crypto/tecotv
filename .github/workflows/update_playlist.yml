name: Playlist Güncelle

on:
  schedule:
    - cron: '*/15 * * * *'  # Her 15 dakikada bir otomatik çalışır
  workflow_dispatch:       # Elle başlatma butonu

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deno Kur (yt-dlp JS Runtime İçin)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: yt-dlp Kur
        run: |
          python -m pip install --upgrade pip
          # [default] eki ejs challenge çözücü paketleri de yükler
          pip install "yt-dlp[default]" urllib3        

      - name: Çerez dosyasını oluştur
        env:
          COOKIES: ${{ secrets.COOKIES_TXT }}
        run: |
          if [ -z "$COOKIES" ]; then
            echo "COOKIES_TXT secret missing"
            exit 1
          fi
          echo "$COOKIES" > cookies.txt
          
      - name: Playlist Oluştur
        run: python generate_playlist.py

      # Üçüncü parti paket yerine doğrudan standart Git komutları kullanıyoruz
      - name: Değişiklikleri Kaydet ve Gönder
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add playlist.m3u streams/
          # Eğer değişiklik varsa commit et ve pushla, yoksa hata vermeden geç
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Playlist Update" && git push)

      - name: Hassas dosyaları temizle
        if: always()
        run: |
          rm -f cookies.txt wgcf-profile.conf wgcf-account.toml 2>/dev/null || true   
